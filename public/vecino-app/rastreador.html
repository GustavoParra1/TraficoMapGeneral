<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mi rastreador</title>
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi rastreador">
<style>
:root {
  --marino: #111827;
  --marino-2: #1f2937;
  --fondo: #f1f5f9;
  --tarjeta: #ffffff;
  --texto: #0f172a;
  --suave: #64748b;
  --linea: #e2e8f0;
  --cian: #0ea5e9;
  --verde: #16a34a;
  --rojo: #dc2626;
  --violeta: #7c3aed;
  --azul: #2563eb;
  --ambar: #d97706;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--fondo); color: var(--texto);
  display: flex; flex-direction: column;
}
button { font-family: inherit; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--cian); outline-offset: 2px; }

/* ---------- encabezado ---------- */
.cab {
  background: var(--marino); color: #fff; flex-shrink: 0;
  padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  display: flex; align-items: center; gap: 10px;
}
.cab-volver {
  color: #fff; text-decoration: none; font-size: 30px; line-height: 1;
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  border-radius: 10px; margin-left: -6px;
}
.cab h1 { flex: 1; font-size: 22px; font-weight: 800; letter-spacing: -0.2px; }
.cab-salir {
  background: var(--marino-2); color: #fff; border: 1px solid rgba(255,255,255,.22);
  padding: 9px 16px; border-radius: 10px; font-size: 14px; cursor: pointer;
}

/* ---------- contenido ---------- */
.cuerpo { flex: 1; overflow-y: auto; padding: 14px 14px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; width: 100%; margin: 0 auto; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; min-width: 120px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 13px 18px; border-radius: 14px; border: none; cursor: pointer;
  background: #e2e8f0; color: #334155; font-size: 15px; font-weight: 700;
}
.chip.activo { background: var(--cian); color: #fff; }
.chip.mas { background: transparent; border: 2px dashed #94a3b8; color: #475569; min-width: 0; }

.mapa-card { position: relative; border-radius: 18px; overflow: hidden; background: #dbe4ef; height: 270px; border: 1px solid var(--linea); }
#mapa { width: 100%; height: 100%; }
.estado-chip {
  position: absolute; top: 12px; left: 12px; z-index: 500;
  display: flex; align-items: center; gap: 7px;
  color: #fff; font-size: 13px; font-weight: 800; padding: 7px 13px; border-radius: 999px;
  background: var(--verde);
}
.estado-chip::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
.estado-chip.vivo::before { animation: latido 1.6s ease-out infinite; }
.estado-chip.sin-senal { background: var(--ambar); }
.estado-chip.robado { background: var(--rojo); }
.seguir {
  position: absolute; top: 12px; right: 12px; z-index: 500;
  background: #fff; color: var(--texto); border: 1px solid var(--linea);
  font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 999px; cursor: pointer;
}
.seguir.off { color: var(--suave); }
@keyframes latido { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.8); } 100% { box-shadow: 0 0 0 9px rgba(255,255,255,0); } }
@media (prefers-reduced-motion: reduce) { .estado-chip.vivo::before { animation: none; } }

.punto { width: 22px; height: 22px; border-radius: 50%; background: var(--azul); border: 4px solid #fff; box-shadow: 0 0 0 7px rgba(37,99,235,.28), 0 2px 6px rgba(0,0,0,.35); }
.punto.robado { background: var(--rojo); box-shadow: 0 0 0 7px rgba(220,38,38,.3), 0 2px 6px rgba(0,0,0,.35); }

.alerta { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.35; display: none; }
.alerta.rojo { display: block; background: var(--rojo); color: #fff; font-weight: 700; }
.alerta.ambar { display: block; background: #fef3c7; color: #92400e; }

.vcard { background: var(--tarjeta); border-radius: 18px; padding: 16px; margin-top: 12px; box-shadow: 0 4px 16px rgba(15,23,42,.07); }
.vcab { display: flex; align-items: center; gap: 12px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--azul); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
.vnombre { font-size: 20px; font-weight: 800; letter-spacing: -0.2px; overflow-wrap: anywhere; }
.vsub { font-size: 14px; color: var(--suave); margin-top: 2px; }
.datos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.dato { background: #eff4fb; border-radius: 14px; padding: 12px 14px; }
.dato small { display: block; font-size: 13px; color: var(--suave); }
.dato b { display: block; font-size: 26px; font-weight: 800; margin-top: 2px; letter-spacing: -0.3px; }
.dato b.chico { font-size: 20px; padding-top: 5px; }
.dato b.ok { color: var(--verde); }
.dato b.mal { color: var(--ambar); }

.acciones { display: flex; gap: 10px; margin-top: 12px; }
.accion {
  flex: 1; background: #fff; border-radius: 16px; padding: 14px 6px 12px;
  border: 3px solid; cursor: pointer; font-size: 15px; font-weight: 800;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.accion span { font-size: 28px; line-height: 1.1; }
.accion.azul { border-color: var(--azul); color: var(--azul); }
.accion.violeta { border-color: var(--violeta); color: var(--violeta); }
.accion.rojo { border-color: var(--rojo); color: var(--rojo); }
.accion.verde { border-color: var(--verde); color: var(--verde); }
.accion.gris { border-color: #94a3b8; color: #475569; }

.vacio { background: var(--tarjeta); border-radius: 18px; padding: 24px 18px; text-align: center; box-shadow: 0 4px 16px rgba(15,23,42,.07); }
.vacio h2 { font-size: 20px; margin-bottom: 8px; }
.vacio p { color: var(--suave); font-size: 15px; line-height: 1.45; margin-bottom: 16px; }

.cargando { text-align: center; color: var(--suave); padding: 60px 0; font-size: 15px; }

/* ---------- botones y formularios ---------- */
.btn { display: block; width: 100%; text-decoration: none; text-align: center; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
.btn.cian { background: var(--cian); color: #fff; }
.btn.claro { background: #e2e8f0; color: var(--texto); }
.btn.peligro { background: var(--rojo); color: #fff; }
.btn.ok { background: var(--verde); color: #fff; }
.btn.llamar { background: #fff; color: var(--rojo); border: 2.5px solid var(--rojo); }
.inp { width: 100%; padding: 13px 14px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 16px; background: #fff; margin-bottom: 10px; color: var(--texto); }
.lbl { display: block; font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 6px; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 16px; margin: 4px 0 16px; }
.chk input { width: 22px; height: 22px; }

/* ---------- panel inferior ---------- */
.velo { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 900; opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: #fff;
  border-radius: 22px 22px 0 0; max-height: 86vh; overflow-y: auto;
  padding: 10px 18px calc(22px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .25s ease; max-width: 560px; margin: 0 auto;
}
.sheet::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 3px; background: #cbd5e1; margin: 0 auto 14px; }
body.con-sheet .velo { opacity: 1; pointer-events: auto; }
body.con-sheet .sheet { transform: translateY(0); }
@media (prefers-reduced-motion: reduce) { .sheet, .velo { transition: none; } }
.sheet h3 { font-size: 21px; margin-bottom: 10px; }
.sheet-txt { font-size: 16px; line-height: 1.45; color: #334155; margin-bottom: 16px; }
.sheet-acc { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.fam { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--linea); font-size: 15px; }
.fam small { display: block; color: var(--suave); font-size: 13px; }
.fam button { background: none; border: none; color: var(--rojo); font-weight: 800; font-size: 15px; cursor: pointer; padding: 8px; }
.nota { font-size: 13px; color: var(--suave); line-height: 1.4; margin: 10px 0 14px; }

/* ---------- aviso ---------- */
.toast { position: fixed; left: 14px; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 1200; max-width: 520px; margin: 0 auto; padding: 14px 16px; border-radius: 14px; font-size: 15px; font-weight: 600; color: #fff; background: var(--marino); display: none; }
.toast.ok { background: var(--verde); }
.toast.error { background: var(--rojo); }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<header class="cab">
  <a class="cab-volver" href="index.html" aria-label="Volver a denuncias">‹</a>
  <h1>Mi rastreador</h1>
  <button class="cab-salir" id="btn-salir">Salir</button>
</header>

<main class="cuerpo">
  <div id="cargando" class="cargando">Buscando tus vehículos…</div>

  <div id="chips" class="chips" role="tablist" aria-label="Mis vehículos"></div>

  <div id="principal" style="display:none">
    <div class="mapa-card">
      <div id="mapa"></div>
      <div id="estado-chip" class="estado-chip vivo">EN VIVO</div>
      <button id="btn-seguir" class="seguir" data-act="seguir">Siguiendo</button>
    </div>
    <div id="alerta" class="alerta" role="status"></div>

    <section class="vcard">
      <div class="vcab">
        <div class="avatar">🚗</div>
        <div>
          <div class="vnombre" id="v-nombre">—</div>
          <div class="vsub" id="v-sub">Buscando posición…</div>
        </div>
      </div>
      <div class="datos">
        <div class="dato"><small>Velocidad</small><b id="v-vel">—</b></div>
        <div class="dato"><small>Estado</small><b id="v-estado" class="chico">—</b></div>
      </div>
    </section>

    <div id="acciones" class="acciones"></div>
  </div>

  <div id="vacio" style="display:none"></div>
</main>

<div class="velo" id="velo" data-act="cerrar"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="../js/rastreador.js?v=20261010002"></script>
</body>
</html>
